# Publica el sitio (05-sitio) en GitHub Pages a través de la rama gh-pages.
# Se ejecuta cuando cambia algo del sitio en main, o a mano desde la pestaña Actions.
name: Publicar sitio web

on:
  push:
    branches: [main]
    paths:
      - "05-sitio/**"
      - ".github/workflows/publicar-web.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  publicar:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar el repositorio
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Copiar 05-sitio a la rama gh-pages
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git subtree split --prefix 05-sitio -b gh-pages-temp
          git push -f origin gh-pages-temp:gh-pages
